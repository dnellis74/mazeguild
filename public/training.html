<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/character-creation.css">
</head>
<body>
<div class="stage">
  <div class="app" id="app"></div>
</div>
<script>
/**
 * Thin training UI — rules live in /api/training/* (src/training).
 * Character is still persisted in localStorage until a real store exists.
 */
const STORAGE_KEY = 'mazeguild.character';
const app = document.getElementById('app');

const state = {
  character: null,
  ui: {
    hubTab: 'sheet',
    worldView: 'areas',
    worldArea: null,
    worldBuilding: null,
    worldRoom: null,
    pendingChoice: null,
    originDraft: null,
  },
  view: null,
  jobTicker: null,
};

function esc(s){
  return String(s ?? '')
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function persist(){
  if(!state.character) return;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.character));
}

async function apiView(){
  const res = await fetch('/api/training/view', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ character: state.character, ui: state.ui }),
  });
  const data = await res.json();
  if(!res.ok){
    if(data.redirect){ window.location.href = data.redirect; return null; }
    throw new Error(data.error || 'View failed');
  }
  state.character = data.character;
  state.ui = data.ui;
  state.view = data.view;
  persist();
  return data;
}

async function apiAction(action){
  const res = await fetch('/api/training/action', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ character: state.character, ui: state.ui, action }),
  });
  const data = await res.json();
  if(!res.ok){
    if(data.redirect){ window.location.href = data.redirect; return null; }
    throw new Error(data.error || 'Action failed');
  }
  state.character = data.character;
  state.ui = data.ui;
  state.view = data.view;
  persist();
  if(data.toast) showToast(data.toast);
  syncJobTicker(!!data.jobRunning);
  return data;
}

function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

/** Client-side progress from activeJob timestamps — no API needed until complete. */
function localJobProgress(job){
  if(!job) return null;
  const durationMs = job.durationMs;
  const fills = job.fills;
  const elapsed = Date.now() - job.startedAt;
  const pct = Math.min(1, elapsed / durationMs);
  const exact = pct * fills;
  const filled = Math.floor(exact);
  const partial = filled >= fills ? 0 : Math.min(1, exact - filled);
  const title = job.kind === 'activity'
    ? (job.detail ? `${job.activity} · ${job.detail}` : job.activity)
    : job.kind === 'room' ? job.room
    : job.kind === 'building' ? job.building
    : job.area;
  const label = job.kind === 'activity' ? 'Participating'
    : job.kind === 'room' ? 'Exploring room'
    : job.kind === 'building' ? 'Surveying building'
    : 'Scouting area';
  const tick = Number.isInteger(job.fillMsSec)
    ? String(job.fillMsSec)
    : String(Math.round(job.fillMsSec * 10) / 10);
  return {
    label,
    title,
    fills,
    filled: Math.min(fills, filled),
    partial,
    remainingSec: Math.ceil(Math.max(0, durationMs - elapsed) / 1000),
    fillNote: `${fills} fills of ${tick}s`,
    done: elapsed >= durationMs,
  };
}

function syncJobTicker(running){
  if(!running){
    if(state.jobTicker){ clearInterval(state.jobTicker); state.jobTicker = null; }
    return;
  }
  if(state.jobTicker) return;
  state.jobTicker = setInterval(async ()=>{
    const job = state.character && state.character.activeJob;
    if(!job){
      syncJobTicker(false);
      return;
    }
    const progress = localJobProgress(job);
    if(progress && progress.done){
      syncJobTicker(false);
      try {
        await apiAction({ type: 'complete-job' });
        render();
      } catch (err) {
        console.error(err);
        showToast(String(err.message || err));
      }
      return;
    }
    // Soft-update the bar only — no network.
    if(state.view) state.view.job = progress;
    if(state.ui.hubTab === 'world'){
      const panel = document.querySelector('.job-panel');
      if(panel && progress){
        const wrap = document.createElement('div');
        wrap.innerHTML = renderJob(progress);
        panel.replaceWith(wrap.firstElementChild);
      }
    }
  }, 250);
}

function renderPending(pending){
  if(!pending) return '';
  if(pending.type === 'favored-enemy'){
    return `
      <div class="feature-choice">
        <button type="button" class="back" data-action="cancel-choice">← Back</button>
        <p class="kicker">Favored Enemy</p>
        <h2>Choose your quarry</h2>
        <p class="lede" style="margin-top:8px">Three quarries offer themselves.</p>
        <div class="choice-list">
          ${pending.options.map(enemy=>`
            <button type="button" class="choice-card" data-action="confirm-favored-enemy" data-enemy="${esc(enemy)}">
              <span class="choice-title">${esc(enemy)}</span>
              <span class="choice-sub">Study this as your favored enemy</span>
            </button>`).join('')}
        </div>
      </div>`;
  }
  if(pending.type === 'cantrip' || pending.type === 'spell'){
    const kind = pending.type;
    const confirm = kind === 'cantrip' ? 'confirm-cantrip' : 'confirm-spell';
    const idAttr = kind === 'cantrip' ? 'data-cantrip-id' : 'data-spell-id';
    return `
      <div class="feature-choice">
        <button type="button" class="back" data-action="cancel-choice">← Back</button>
        <p class="kicker">${esc(pending.archetype)} ${kind === 'cantrip' ? 'cantrips' : '1st-level spells'}</p>
        <h2>Choose a ${kind}</h2>
        <p class="lede" style="margin-top:8px">${pending.owned} of ${pending.allowance} known · pick ${pending.remaining} more.</p>
        <div class="choice-list">
          ${pending.options.map(o=>`
            <button type="button" class="choice-card" data-action="${confirm}" ${idAttr}="${esc(o.id)}">
              <span class="choice-title">${esc(o.name)}</span>
              <span class="choice-sub">${esc(o.description || '')}</span>
            </button>`).join('')}
        </div>
      </div>`;
  }
  return '';
}

function renderJob(job){
  if(!job) return '';
  const segs = Array.from({length: job.fills}, (_,i)=>{
    if(i < job.filled) return '<span class="seg filled"></span>';
    if(i === job.filled && job.partial > 0){
      return `<span class="seg partial" style="--pct:${Math.round(job.partial*100)}%"></span>`;
    }
    return '<span class="seg"></span>';
  }).join('');
  return `
    <div class="job-panel">
      <div class="job-label">${esc(job.label)}</div>
      <div class="job-title">${esc(job.title)}</div>
      <div class="ticks-bar">${segs}</div>
      <div class="job-eta">${job.remainingSec}s remaining · ${esc(job.fillNote)}</div>
    </div>`;
}

function renderSheet(sheet){
  if(!sheet) return '';
  const abilities = sheet.abilities.map(a=>`
    <div class="ability-cell"><div class="ab">${esc(a.ab)}</div><div class="sc">${a.score}</div><div class="mod">${esc(a.mod)}</div></div>
  `).join('');
  const features = sheet.features.length
    ? `<div class="feature-list">${sheet.features.map(f=>`
        <div class="feature-card"><div class="name">${esc(f.name)}${f.detail?`: ${esc(f.detail)}`:''}</div></div>
      `).join('')}</div>`
    : `<p class="empty-note">No features yet. Spend time in the World to earn them.</p>`;
  const arch = sheet.archetypes.length
    ? `<div class="archetype-summary"><div class="from">${sheet.archetypes.map(esc).join('<br>')}</div></div>`
    : `<p class="empty-note">Archetypes appear from the features you earn — up to two draws.</p>`;
  const cantrips = sheet.cantrips.length
    ? `<div class="feature-list">${sheet.cantrips.map(c=>`
        <div class="feature-card"><div class="name">${esc(c.name)}</div><div class="from">${esc(c.from)}</div></div>
      `).join('')}</div>`
    : `<p class="empty-note">Cantrips appear once an archetype grants them — half now, the rest with full spellcasting.</p>`;
  const spells = sheet.spells.length
    ? `<div class="feature-list">${sheet.spells.map(s=>`
        <div class="feature-card"><div class="name">${esc(s.name)}</div><div class="from">${esc(s.from)}</div></div>
      `).join('')}</div>`
    : `<p class="empty-note">1st-level spells unlock when you learn spellcasting or pact magic.</p>`;
  return `
    <div class="sheet-block"><div class="sheet-label">Identity</div><div class="sheet-value">${esc(sheet.identity.value)}</div><div class="sheet-sub">${esc(sheet.identity.sub)}</div></div>
    <div class="sheet-block"><div class="sheet-label">Feature points</div><div class="points-pill"><strong>${sheet.featurePoints}</strong> of 2 remaining</div></div>
    <div class="sheet-block"><div class="sheet-label">Abilities</div><div class="ability-grid">${abilities}</div><p class="mechanic-note" style="margin-top:10px">${esc(sheet.abilitiesNote)}</p></div>
    ${sheet.definingExperience?`<div class="sheet-block"><div class="sheet-label">Defining experience</div><div class="sheet-value">${esc(sheet.definingExperience.scenario)}</div><div class="sheet-sub">${esc(sheet.definingExperience.reaction)}</div></div>`:''}
    <div class="sheet-block"><div class="sheet-label">Features</div>${features}</div>
    <div class="sheet-block"><div class="sheet-label">Archetypes drawn from</div>${arch}</div>
    <div class="sheet-block"><div class="sheet-label">Cantrips</div>${cantrips}</div>
    <div class="sheet-block"><div class="sheet-label">Spells</div>${spells}</div>
    <div class="sheet-block">
      <div class="sheet-label">Origin story</div>
      <p class="mechanic-note" style="margin-top:0;margin-bottom:10px">${esc(sheet.originStory.hint)}</p>
      <textarea class="origin-story" id="origin-story" rows="8">${esc(sheet.originStory.text)}</textarea>
      <div class="origin-actions">
        <button type="button" class="primary" data-action="save-origin-story">Save</button>
        <button type="button" data-action="reset-origin-prompt">Reset to prompt</button>
      </div>
    </div>`;
}

function renderWorld(world, unlockNote, job){
  if(!world) return '';
  const crumb = `<div class="world-crumb">${world.crumb.map((c,i)=>{
    const sep = i ? ' / ' : '';
    if(c.action) return `${sep}<button data-action="${esc(c.action)}" data-view="${esc(c.view||'')}">${esc(c.label)}</button>`;
    return `${sep}${esc(c.label)}`;
  }).join('')}</div>`;
  const cards = world.cards.length
    ? world.cards.map(card=>{
        const dataAttrs = Object.entries(card.data||{}).map(([k,v])=>{
          const attr = k.replace(/[A-Z]/g, m=>'-'+m.toLowerCase());
          return `data-${attr}="${esc(v)}"`;
        }).join(' ');
        return `
          <button class="world-card ${card.unlocked?'is-unlocked':''} ${card.active?'is-active':''}"
                  data-action="${esc(card.action)}" ${dataAttrs} ${card.disabled?'disabled':''}>
            <span class="wc-title">${esc(card.title)}</span>
            <span class="wc-sub">${esc(card.sub).replace(/\n/g,'<br>')}</span>
            <span class="wc-status">${esc(card.status)}</span>
          </button>`;
      }).join('')
    : `<p class="empty-note">${esc(world.emptyNote||'Nothing here.')}</p>`;
  return `${crumb}<div class="world-grid">${cards}</div>${renderJob(job)}<p class="mechanic-note">${esc(unlockNote)}</p>`;
}

function render(){
  const v = state.view;
  if(!v){
    app.innerHTML = `<div class="screen"><p class="lede">Loading…</p></div><div class="toast" id="toast"></div>`;
    return;
  }
  let body = '';
  if(v.pending) body = renderPending(v.pending);
  else if(v.tab === 'sheet') body = renderSheet(v.sheet);
  else if(v.tab === 'world'){
    const liveJob = state.character?.activeJob
      ? localJobProgress(state.character.activeJob)
      : v.job;
    body = renderWorld(v.world, v.unlockNote, liveJob);
  }
  else body = `<div class="quest-stub"><h2>Quest</h2><p class="lede" style="margin:0 auto">${esc(v.quest?.message||'')}</p></div>`;

  app.innerHTML = `
  <div class="hub">
    <div class="hub-header">
      <p class="kicker">Your record</p>
      <h1>${esc(v.header.title)}</h1>
      <p class="hub-meta">${v.header.featurePoints} feature point${v.header.featurePoints===1?'':'s'} left · <button data-action="restart-init" style="text-decoration:underline;color:var(--ink-soft)">New character</button></p>
    </div>
    <div class="hub-tabs" role="tablist">
      <button class="hub-tab ${v.tab==='sheet'?'is-active':''}" data-action="hub-tab" data-tab="sheet">Sheet</button>
      <button class="hub-tab ${v.tab==='world'?'is-active':''}" data-action="hub-tab" data-tab="world">World</button>
      <button class="hub-tab ${v.tab==='quest'?'is-active':''}" data-action="hub-tab" data-tab="quest">Quest</button>
    </div>
    <div class="hub-body">${body}</div>
  </div>
  <div class="toast" id="toast"></div>`;
  bindEvents();
  syncJobTicker(!!state.character?.activeJob);
}

function actionFromEl(el){
  const type = el.dataset.action;
  if(type === 'hub-tab') return { type, tab: el.dataset.tab };
  if(type === 'world-nav') return { type, view: el.dataset.view };
  if(type === 'world-select-area') return { type, area: el.dataset.area };
  if(type === 'world-select-building') return { type, building: el.dataset.building };
  if(type === 'world-select-room') return { type, room: el.dataset.room };
  if(type === 'world-select-activity') return { type, skillId: el.dataset.skillId };
  if(type === 'world-select-cantrip' || type === 'world-select-spell') return { type, archetype: el.dataset.archetype };
  if(type === 'confirm-favored-enemy') return { type, enemy: el.dataset.enemy };
  if(type === 'confirm-cantrip') return { type, cantripId: el.dataset.cantripId };
  if(type === 'confirm-spell') return { type, spellId: el.dataset.spellId };
  if(type === 'cancel-choice') return { type };
  if(type === 'reset-origin-prompt') return { type };
  if(type === 'save-origin-story'){
    const text = document.getElementById('origin-story')?.value || '';
    return { type, text };
  }
  return null;
}

function bindEvents(){
  app.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      const actionName = e.currentTarget.dataset.action;
      if(actionName === 'restart-init'){
        localStorage.removeItem(STORAGE_KEY);
        window.location.href = '/character-initialization.html';
        return;
      }
      const action = actionFromEl(e.currentTarget);
      if(!action) return;
      try {
        await apiAction(action);
        render();
      } catch (err) {
        console.error(err);
        showToast(String(err.message || err));
      }
    });
  });
  const origin = document.getElementById('origin-story');
  if(origin){
    origin.addEventListener('input', ()=>{
      state.ui.originDraft = origin.value;
    });
  }
}

async function boot(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){
      window.location.href = '/character-initialization.html';
      return;
    }
    state.character = JSON.parse(raw);
    await apiView();
    render();
  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="screen"><p class="lede">Could not load training.</p><pre style="white-space:pre-wrap;font-size:12px;color:var(--ink-soft)">${esc(String(err && err.message || err))}</pre><p class="mechanic-note"><button data-action="restart-init">Start over</button></p></div><div class="toast" id="toast"></div>`;
    bindEvents();
  }
}

boot();
</script>
</body>
</html>
