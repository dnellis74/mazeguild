<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Race Selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDE6D3;
    --paper-dim: #E2D8C0;
    --ink: #2A2620;
    --ink-soft: #6B6355;
    --navy: #182428;
    --navy-deep: #0F1719;
    --seal: #4C7A63;
    --seal-dark: #35594A;
    --rule: #C9BC9C;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'IBM Plex Sans', -apple-system, sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family: var(--font-body);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button{ font-family:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; text-align:left; }
  button:disabled{ cursor:not-allowed; }
  h1,h2,p{ margin:0; }
  ::selection{ background: var(--seal); color:#fff; }

  :focus-visible{ outline: 2px solid var(--seal); outline-offset: 3px; border-radius:2px; }

  .stage{
    min-height:100vh;
    min-height:100dvh;
    background: radial-gradient(ellipse at 50% 0%, #223339 0%, var(--navy) 55%, var(--navy-deep) 100%);
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }

  .app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  @media (min-width:560px){
    .stage{ padding:56px 16px; align-items:center; }
    .app{
      min-height:0;
      height:min(820px, 92vh);
      border-radius:16px;
      box-shadow: 0 40px 70px -24px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.08);
    }
  }

  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    padding: 28px 24px 32px;
    overflow-y:auto;
    animation: fadeIn .28s ease both;
  }
  @media (prefers-reduced-motion: reduce){
    .screen{ animation:none; }
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .kicker{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }

  h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(26px,7vw,32px);
    line-height:1.18;
    letter-spacing:-0.01em;
  }
  h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:22px;
    line-height:1.3;
  }
  .lede{
    margin-top:14px;
    font-size:16px;
    line-height:1.55;
    color: #45403A;
    max-width:36ch;
  }

  /* ---- Entry screen ---- */
  .choice-list{
    margin-top:28px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .choice-card{
    display:flex;
    flex-direction:column;
    gap:4px;
    padding:18px 18px;
    background:var(--paper-dim);
    border:1px solid var(--rule);
    border-left:3px solid var(--seal);
    border-radius:6px;
    transition: background .15s ease, transform .1s ease;
  }
  .choice-card:active{ transform:scale(.99); }
  .choice-card:hover{ background:#DCD1B4; }
  .choice-card.is-locked{
    border-left-color:var(--rule);
    opacity:.55;
  }
  .choice-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:18px;
  }
  .choice-sub{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.4;
  }

  /* ---- Topbar (quiz + pick) ---- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .back{
    font-size:14px;
    color:var(--ink-soft);
    padding:6px 2px;
  }
  .back:hover{ color:var(--ink); }
  .progress{
    font-size:13px;
    color:var(--ink-soft);
  }

  .ticks{
    display:flex;
    gap:5px;
    margin-bottom:22px;
  }
  .tick{
    width:22px;
    height:4px;
    border-radius:2px;
    background:var(--rule);
  }
  .tick.filled{ background:var(--seal); }

  /* ---- Quiz options ---- */
  .option-list{
    margin-top:22px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    display:flex;
    flex-direction:column;
    gap:3px;
    padding:15px 16px;
    background:var(--paper-dim);
    border:1px solid var(--rule);
    border-radius:6px;
    font-size:15.5px;
    line-height:1.4;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .option:hover{ background:#DCD1B4; }
  .option:active{ transform:scale(.99); }
  .option.chosen{
    background:var(--seal);
    border-color:var(--seal-dark);
    color:#fff;
  }
  .option-main{ font-weight:500; }
  .option-blurb{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.4;
  }
  .option.chosen .option-blurb{ color:rgba(255,255,255,.85); }
  .unsourced-mark{ color:var(--seal-dark); }
  .option.chosen .unsourced-mark{ color:#fff; }

  .mechanic-note{
    margin-top:18px;
    font-size:13px;
    font-style:italic;
    color:var(--ink-soft);
    line-height:1.5;
    max-width:36ch;
  }

  /* ---- Alignment grid ---- */
  .align-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
  }
  .align-cell{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 6px;
    background:var(--paper-dim);
    border:1px solid var(--rule);
    border-radius:5px;
    text-align:center;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .align-cell:active{ transform:scale(.98); }
  .align-cell:hover{ background:#DCD1B4; }
  .align-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
    line-height:1.25;
  }
  .align-cell.is-suggested{
    border-color:var(--seal);
    border-width:2px;
  }
  .align-cell.is-open{
    background:var(--seal);
    border-color:var(--seal-dark);
    color:#fff;
  }
  .align-detail{
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--rule);
  }
  .align-detail p{
    font-size:14.5px;
    line-height:1.55;
    color:#45403A;
    max-width:38ch;
    margin-bottom:14px;
  }
  .align-detail .confirm-btn{ margin:0; }

  /* ---- Defining experience ---- */
  .experience{
    margin-top:22px;
    padding:16px 18px;
    background:var(--paper-dim);
    border-left:3px solid var(--seal);
    border-radius:0 5px 5px 0;
  }
  .experience-scene{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.5;
    margin-bottom:8px;
  }
  .experience-answer{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
    line-height:1.4;
  }

  /* ---- Pick screen ---- */
  .suggestion{
    font-size:14px;
    color:var(--ink-soft);
    margin-bottom:16px;
  }
  .suggestion strong{ color:var(--ink); }

  .race-list{
    display:flex;
    flex-direction:column;
    border-top:1px solid var(--rule);
  }
  .race-row{ border-bottom:1px solid var(--rule); }
  .race-head{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 2px;
  }
  .race-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:17px;
    flex:1;
  }
  .tag{
    font-size:11.5px;
    color:var(--seal-dark);
    border:1px solid var(--seal);
    border-radius:20px;
    padding:2px 8px;
  }
  .chev{
    font-size:18px;
    color:var(--ink-soft);
    width:16px;
    text-align:center;
  }
  .race-body{
    display:grid;
    grid-template-rows:0fr;
    transition: grid-template-rows .25s ease;
  }
  .race-row.is-open .race-body{ grid-template-rows:1fr; }
  .race-body-inner{ overflow:hidden; }
  .race-body p{
    font-size:14.5px;
    line-height:1.55;
    color:#45403A;
    padding: 0 2px 14px;
    max-width:38ch;
  }
  .confirm-btn{
    margin: 0 2px 18px;
    padding:11px 18px;
    background:var(--seal);
    color:#fff;
    border-radius:5px;
    font-size:14.5px;
    font-weight:500;
    transition: background .15s ease;
  }
  .confirm-btn:hover{ background:var(--seal-dark); }

  /* ---- Confirm screen ---- */
  .confirm{ align-items:flex-start; padding-top:20px; }
  .seal-wrap{
    align-self:center;
    margin: 10px 0 22px;
  }
  .seal{
    width:104px;
    height:104px;
    border-radius:50%;
    border:2.5px solid var(--seal-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--seal-dark);
    transform:rotate(-8deg);
    text-align:center;
  }
  @media (prefers-reduced-motion: no-preference){
    .seal{ animation: stampIn .5s cubic-bezier(.2,.8,.2,1) both; }
  }
  @keyframes stampIn{
    0%{ opacity:0; transform:scale(1.6) rotate(-16deg); }
    60%{ opacity:1; transform:scale(.92) rotate(-6deg); }
    100%{ opacity:1; transform:scale(1) rotate(-8deg); }
  }
  .note{
    margin-top:16px;
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.5;
    max-width:34ch;
  }
  .confirm-actions{
    margin-top:auto;
    padding-top:24px;
    display:flex;
    gap:10px;
  }
  .confirm-actions button{
    flex:1;
    padding:13px 14px;
    border-radius:6px;
    font-size:14.5px;
    font-weight:500;
    text-align:center;
  }
  .confirm-actions button:not(.primary){
    background:transparent;
    border:1px solid var(--rule);
    color:var(--ink-soft);
  }
  .confirm-actions button.primary{
    background:var(--seal);
    color:#fff;
  }
  .confirm-actions button.primary:hover{ background:var(--seal-dark); }
  .confirm-actions button.primary:disabled{
    background:var(--rule);
    color:var(--ink-soft);
  }
  .confirm-actions button.primary:disabled:hover{ background:var(--rule); }

  /* ---- Toast ---- */
  .toast{
    position:absolute;
    left:20px; right:20px; bottom:20px;
    background:var(--ink);
    color:var(--paper);
    font-size:13.5px;
    padding:12px 14px;
    border-radius:6px;
    opacity:0;
    transform:translateY(8px);
    transition: opacity .2s ease, transform .2s ease;
    pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  /* ---- Hub (Sheet / World / Quest) ---- */
  .hub{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
    overflow:hidden;
  }
  .hub-header{
    padding:18px 24px 0;
    flex-shrink:0;
  }
  .hub-header .kicker{ margin-bottom:4px; }
  .hub-header h1{
    font-size:clamp(22px,6vw,26px);
  }
  .hub-meta{
    margin-top:6px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .hub-tabs{
    display:flex;
    gap:0;
    margin-top:16px;
    border-bottom:1px solid var(--rule);
    flex-shrink:0;
    padding:0 24px;
  }
  .hub-tab{
    flex:1;
    padding:12px 8px;
    text-align:center;
    font-size:14px;
    font-weight:500;
    color:var(--ink-soft);
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .hub-tab.is-active{
    color:var(--ink);
    border-bottom-color:var(--seal);
  }
  .hub-tab:disabled{
    opacity:.4;
  }
  .hub-body{
    flex:1;
    overflow-y:auto;
    padding:20px 24px 28px;
    animation: fadeIn .22s ease both;
  }

  .sheet-block{
    margin-bottom:18px;
    padding-bottom:16px;
    border-bottom:1px solid var(--rule);
  }
  .sheet-block:last-child{ border-bottom:none; margin-bottom:0; }
  .sheet-label{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .sheet-value{
    font-family:var(--font-display);
    font-weight:600;
    font-size:18px;
    line-height:1.3;
  }
  .sheet-sub{
    margin-top:4px;
    font-size:14px;
    color:#45403A;
    line-height:1.45;
  }
  .points-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    background:var(--paper-dim);
    border:1px solid var(--rule);
    border-radius:6px;
    font-size:14px;
  }
  .points-pill strong{ font-family:var(--font-display); }
  .feature-list,.archetype-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .feature-card,.archetype-chip{
    padding:12px 14px;
    background:var(--paper-dim);
    border:1px solid var(--rule);
    border-left:3px solid var(--seal);
    border-radius:5px;
  }
  .feature-card .name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
  }
  .feature-card .from{
    margin-top:3px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .empty-note{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.5;
    font-style:italic;
  }
  .ability-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .ability-cell{
    padding:10px 8px;
    background:var(--paper-dim);
    border:1px solid var(--rule);
    border-radius:5px;
    text-align:center;
  }
  .ability-cell .ab{
    font-size:11px;
    letter-spacing:.08em;
    color:var(--ink-soft);
  }
  .ability-cell .sc{
    font-family:var(--font-display);
    font-weight:600;
    font-size:20px;
    margin-top:2px;
  }

  .world-crumb{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:14px;
    line-height:1.4;
  }
  .world-crumb button{
    color:var(--seal-dark);
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .world-grid{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .world-card{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:14px 16px;
    background:var(--paper-dim);
    border:1px solid var(--rule);
    border-radius:6px;
    transition: background .15s ease, border-color .15s ease;
  }
  .world-card:hover{ background:#DCD1B4; }
  .world-card.is-locked{ opacity:.55; }
  .world-card.is-active{
    border-color:var(--seal);
    background:#E4F0E8;
  }
  .world-card.is-unlocked{
    border-left:3px solid var(--seal);
  }
  .world-card .wc-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:17px;
  }
  .world-card .wc-sub{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.4;
  }
  .world-card .wc-status{
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--seal-dark);
  }

  .job-panel{
    margin-top:18px;
    padding:14px 16px;
    background:var(--navy);
    color:#EDE6D3;
    border-radius:8px;
  }
  .job-panel .job-label{
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:rgba(237,230,211,.7);
    margin-bottom:6px;
  }
  .job-panel .job-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
    margin-bottom:12px;
  }
  .ticks-bar{
    display:flex;
    gap:5px;
  }
  .ticks-bar .seg{
    flex:1;
    height:8px;
    border-radius:3px;
    background:rgba(237,230,211,.2);
  }
  .ticks-bar .seg.filled{ background:var(--seal); }
  .ticks-bar .seg.partial{
    background: linear-gradient(90deg, var(--seal) var(--pct,0%), rgba(237,230,211,.2) var(--pct,0%));
  }
  .job-eta{
    margin-top:8px;
    font-size:12px;
    color:rgba(237,230,211,.65);
  }
  .quest-stub{
    padding:28px 8px;
    text-align:center;
  }
  .quest-stub h2{ margin-bottom:10px; }

</style>
</head>
<body>
<div class="stage">
  <div class="app" id="app"></div>
</div>

<script>

// Feature catalogue loaded from /data/skills.json (area → building → room → activity).
let FEATURES = [];
let WORLD = [];

// Idle unlock timing — change fills / fillMsSec here; duration follows.
const JOB = {
  fills: 6,
  fillMsSec: 2,
};
const JOB_SEGMENTS = JOB.fills;
const JOB_MS = JOB.fills * JOB.fillMsSec * 1000;

function buildWorld(){
  const areas = {};
  for(const f of FEATURES){
    if(!areas[f.area]) areas[f.area] = { name:f.area, buildings:{} };
    const a = areas[f.area];
    if(!a.buildings[f.building]) a.buildings[f.building] = { name:f.building, rooms:{} };
    const b = a.buildings[f.building];
    if(!b.rooms[f.room]) b.rooms[f.room] = { name:f.room, activities:[] };
    const r = b.rooms[f.room];
    if(!r.activities.some(x=>x.activity===f.activity && x.feature===f.feature)){
      r.activities.push({
        activity:f.activity,
        feature:f.feature,
        archetype:f.archetype,
      });
    }
  }
  return Object.values(areas).map(a=>({
    name:a.name,
    buildings:Object.values(a.buildings).map(b=>({
      name:b.name,
      rooms:Object.values(b.rooms).map(r=>({
        name:r.name,
        activities:r.activities,
      })),
    })),
  }));
}

function rebuildWorld(){
  WORLD = buildWorld();
}

function esc(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}


function jobDurationLabel(){
  const secs = JOB.fills * JOB.fillMsSec;
  return secs + 's';
}
function areaKey(area){ return area; }
function buildingKey(area, building){ return area+'::'+building; }
function roomKey(area, building, room){ return area+'::'+building+'::'+room; }
function activityKey(area, building, room, activity){
  return area+'::'+building+'::'+room+'::'+activity;
}

// Creation data loaded from /data/*.json — see boot().
let TRACKS = [];
let RACES = [];
let RACE_QUESTIONS = [];
let ALIGNMENTS = [];
let ALIGNMENT_QUESTIONS = [];
let RACE_QUESTION_OVERRIDES = {};
let RACE_ALIGNMENT_EXTRAS = {};
let RACE_QUESTION_SKIPS = {};
let RACE_AXIS_BIAS = {};

// Assembles the question list a given race actually sees.
function alignmentQuestionsFor(raceId){
  const skips = RACE_QUESTION_SKIPS[raceId] || [];
  const overrides = RACE_QUESTION_OVERRIDES[raceId] || {};
  const base = ALIGNMENT_QUESTIONS
    .filter(q=> !skips.includes(q.id))
    .map(q=> overrides[q.id] ? { ...q, ...overrides[q.id] } : q);
  return base.concat(RACE_ALIGNMENT_EXTRAS[raceId] || []);
}

// Normalized bracketing: sum each axis over ANSWERED questions, divide
// by the largest magnitude that was available across those same
// questions. Partial answers therefore still land somewhere real
// instead of decaying toward Neutral for lack of data.
const AXIS_THRESHOLD = 0.4;

function bracket(ratio){
  if(ratio >= AXIS_THRESHOLD) return 1;
  if(ratio <= -AXIS_THRESHOLD) return -1;
  return 0;
}

function resolveAlignment(){
  const raceId = state.character.raceId;
  const questions = alignmentQuestionsFor(raceId);
  const bias = RACE_AXIS_BIAS[raceId] || { law:0, good:0 };

  let lawSum = bias.law, goodSum = bias.good;
  let lawMax = 0, goodMax = 0;

  state.character.alignment.answers.forEach((ans, i)=>{
    if(!ans) return;
    const q = questions[i];
    const opt = q.options.find(o=>o.id===ans.optionId);
    lawSum  += opt.law;
    goodSum += opt.good;
    lawMax  += Math.max(...q.options.map(o=>Math.abs(o.law)));
    goodMax += Math.max(...q.options.map(o=>Math.abs(o.good)));
  });

  const lawRatio  = lawMax  ? lawSum  / lawMax  : 0;
  const goodRatio = goodMax ? goodSum / goodMax : 0;
  const law = bracket(lawRatio), good = bracket(goodRatio);
  const cell = ALIGNMENTS.find(a=> a.law===law && a.good===good );

  return { law, good, lawSum, goodSum, lawRatio, goodRatio, alignmentId:cell.id };
}

// The single answer the player committed to hardest becomes their
// defining childhood experience. Ties break toward the earliest
// question, so the result is stable rather than order-of-iteration luck.
function definingExperience(){
  const questions = alignmentQuestionsFor(state.character.raceId);
  let best = null, bestWeight = -1;
  state.character.alignment.answers.forEach((ans, i)=>{
    if(!ans) return;
    const q = questions[i];
    const opt = q.options.find(o=>o.id===ans.optionId);
    const weight = Math.abs(opt.law) + Math.abs(opt.good);
    if(weight > bestWeight){
      bestWeight = weight;
      best = { questionId:q.id, scenario:q.text, optionId:opt.id, label:opt.label };
    }
  });
  return best;
}

function computeSuggestion(){
  const totals = {};
  RACES.forEach(r=> totals[r.id]=0 );
  state.character.quizAnswers.forEach((ans, i)=>{
    if(!ans) return;
    const w = RACE_QUESTIONS[i].options[ans.optionIndex].w;
    Object.keys(w).forEach(id=> totals[id]+=w[id] );
  });
  const ranked = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  const top = ranked[0], second = ranked[1];
  if(!top || top[1]===0) return 'human';
  if(second && top[1]-second[1] < 1) return 'human';
  return top[0];
}

    else if(screen==='align-entry') html = renderAlignEntry();
    else if(screen==='align-quiz') html = renderAlignQuiz();
    else if(screen==='align-pick') html = renderAlignPick();
    else if(screen==='align-confirm') html = renderAlignConfirm();
    else if(screen==='hub') html = renderHub();

    console.error(err);
    html = `<div class="screen"><p class="lede">Something broke rendering this screen.</p><pre style="white-space:pre-wrap;font-size:12px;color:var(--ink-soft)">${esc(String(err && err.message || err))}</pre></div>`;

}

function jobProgress(job){
  if(!job) return { filled:0, partial:0, remainingMs:0, done:true };
  const elapsed = Date.now() - job.startedAt;
  const pct = Math.min(1, elapsed / JOB_MS);
  const exact = pct * JOB_SEGMENTS;
  const filled = Math.floor(exact);
  const partial = Math.min(1, exact - filled);
  return {
    filled: Math.min(JOB_SEGMENTS, filled),
    partial: filled >= JOB_SEGMENTS ? 0 : partial,
    remainingMs: Math.max(0, JOB_MS - elapsed),
    done: elapsed >= JOB_MS,
  };
}

function renderJobPanel(){
  const job = state.character.activeJob;
  if(!job) return '';
  const p = jobProgress(job);
  const segs = Array.from({length:JOB_SEGMENTS}, (_,i)=>{
    if(i < p.filled) return '<span class="seg filled"></span>';
    if(i === p.filled && p.partial > 0){
      return `<span class="seg partial" style="--pct:${Math.round(p.partial*100)}%"></span>`;
    }
    return '<span class="seg"></span>';
  }).join('');
  const secs = Math.ceil(p.remainingMs / 1000);
  const title = job.kind==='activity' ? job.activity
    : job.kind==='room' ? job.room
    : job.kind==='building' ? job.building
    : job.area;
  const label = job.kind==='activity' ? 'Participating'
    : job.kind==='room' ? 'Exploring room'
    : job.kind==='building' ? 'Surveying building'
    : 'Scouting area';
  return `
    <div class="job-panel">
      <div class="job-label">${label}</div>
      <div class="job-title">${title}</div>
      <div class="ticks-bar">${segs}</div>

    </div>`;
}

        </button>`;
    }).join('');
  } else {
    const area = WORLD.find(a=>a.name===ui.worldArea);
    const building = area.buildings.find(b=>b.name===ui.worldBuilding);
    const room = building.rooms.find(r=>r.name===ui.worldRoom);
    crumb = `<div class="world-crumb"><button data-action="world-nav" data-view="areas">Areas</button> / <button data-action="world-nav" data-view="buildings">${ui.worldArea}</button> / <button data-action="world-nav" data-view="rooms">${ui.worldBuilding}</button> / ${ui.worldRoom}</div>`;
    cards = room.activities.map(act=>{
      const owned = ch.features.some(f=>f.feature===act.feature && f.activity===act.activity);
      const working = job && job.kind==='activity' && job.activity===act.activity && job.feature===act.feature;
      return `
        <button class="world-card ${owned?'is-unlocked':''} ${working?'is-active':''}"
                data-action="world-select-activity"
                data-activity="${esc(act.activity)}" data-feature="${esc(act.feature)}" data-archetype="${esc(act.archetype)}"
                ${owned || (job && !working) || ch.featurePoints<=0 && !working ? 'disabled':''}>
          <span class="wc-title">${act.activity}</span>
          <span class="wc-sub">Earns <strong>${act.feature}</strong> · ${act.archetype} · 1 point</span>
          <span class="wc-status">${owned?'Earned':working?'Participating…':ch.featurePoints<=0?'No points left':`${jobDurationLabel()} to complete`}</span>
        </button>`;
    }).join('');
  }

  return `
    ${crumb}
    <div class="world-grid">${cards}</div>
    ${renderJobPanel()}
    <p class="mechanic-note">${JOB.fills} fills of ${JOB.fillMsSec}s unlock each layer. Activities spend a feature point and write onto your sheet.</p>`;
}

let jobTicker = null;
function syncJobTicker(){
  const job = state.character.activeJob;
  if(!job){
    if(jobTicker){ clearInterval(jobTicker); jobTicker=null; }
    return;
  }
  if(jobTicker) return;
  jobTicker = setInterval(()=>{
    if(state.ui.screen!=='hub' || !state.character.activeJob){
      if(jobTicker){ clearInterval(jobTicker); jobTicker=null; }
      return;
    }
    const p = jobProgress(state.character.activeJob);
    if(p.done){
      completeJob();
    } else if(state.ui.hubTab==='world'){
      // Soft-update the job panel without restarting the ticker.
      const panel = document.querySelector('.job-panel');
      if(panel){
        const wrap = document.createElement('div');
        wrap.innerHTML = renderJobPanel();
        panel.replaceWith(wrap.firstElementChild);
      }
    }
  }, 250);
}

function completeJob(){
  const job = state.character.activeJob;
  if(!job) return;
  const ch = state.character;
  if(job.kind==='area'){
    ch.unlocked.areas[areaKey(job.area)] = true;
    state.ui.worldView = 'buildings';
    state.ui.worldArea = job.area;
    showToast(`${job.area} open.`);
  } else if(job.kind==='building'){
    ch.unlocked.buildings[buildingKey(job.area, job.building)] = true;
    state.ui.worldView = 'rooms';
    state.ui.worldBuilding = job.building;
    showToast(`${job.building} unlocked.`);
  } else if(job.kind==='room'){
    ch.unlocked.rooms[roomKey(job.area, job.building, job.room)] = true;
    state.ui.worldView = 'activities';
    state.ui.worldRoom = job.room;
    showToast(`${job.room} unlocked.`);
  } else if(job.kind==='activity'){
    if(ch.featurePoints > 0 && !ch.features.some(f=>f.feature===job.feature && f.activity===job.activity)){
      ch.featurePoints -= 1;
      ch.features.push({
        feature: job.feature,
        archetype: job.archetype,
        area: job.area,
        building: job.building,
        room: job.room,
        activity: job.activity,
      });
      showToast(`Learned ${job.feature}.`);
    }
  }
  ch.activeJob = null;
  if(jobTicker){ clearInterval(jobTicker); jobTicker=null; }
  render();
}

function startJob(job){
  if(state.character.activeJob){
    showToast('Already at work.');
    return;
  }
  state.character.activeJob = { ...job, startedAt: Date.now() };
  state.ui.hubTab = 'world';
  render();
}


function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

function bindEvents(){
  app.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
}

function onAction(e){
  const action = e.currentTarget.dataset.action;
  const ui = state.ui, ch = state.character;

  if(action==='start-quiz'){
    ui.screen='quiz'; ui.quizStep=0;
    ch.tookQuiz=true; ch.quizAnswers=[]; ch.suggestedId=null;
    render();
  }
  else if(action==='start-pick'){
    ch.tookQuiz=false; ch.quizAnswers=[]; ch.suggestedId=null;
    ui.expandedId=null;
    ui.screen='pick';
    render();
  }
  else if(action==='answer'){
    const idx = parseInt(e.currentTarget.dataset.index,10);
    const q = RACE_QUESTIONS[ui.quizStep];
    // recorded here, and it stays on state.character past this screen -
    // race pick, confirm, and the racial-choice screen all read the same
    // object, this is never cleared once the quiz is taken.
    ch.quizAnswers[ui.quizStep] = { question:q.text, optionIndex:idx, optionLabel:q.options[idx].label };
    if(ui.quizStep < RACE_QUESTIONS.length-1){
      ui.quizStep++;
      render();
    } else {
      ch.suggestedId = computeSuggestion();
      ui.expandedId=null;
      ui.screen='pick';
      render();
    }
  }
  else if(action==='back'){
    if(ui.screen==='quiz'){
      if(ui.quizStep>0){ ui.quizStep--; render(); }
      else { ui.screen='entry'; render(); }
    } else if(ui.screen==='pick'){
      ui.screen='entry'; render();
    } else if(ui.screen==='racial'){
      const r = raceById(ch.raceId);
      ui.screen = r.subraces ? 'subrace' : 'confirm';
      render();
    } else if(ui.screen==='subrace'){
      ui.screen='confirm'; render();
    } else if(ui.screen==='align-quiz'){
      if(ui.alignStep>0){ ui.alignStep--; render(); }
      else { ui.screen='align-entry'; render(); }
    } else if(ui.screen==='align-pick'){
      ui.screen='align-entry'; ui.expandedId=null; render();
    }
  }
  else if(action==='toggle'){
    const id = e.currentTarget.dataset.id;
    ui.expandedId = ui.expandedId===id ? null : id;
    render();
  }
  else if(action==='confirm'){
    ch.raceId = e.currentTarget.dataset.id;
    ch.subrace = null;       // picking a (possibly new) race clears prior subrace...
    ch.racialChoice = null;  // ...and prior racial-choice picks
    ui.screen='confirm';
    render();
  }
  else if(action==='change'){
    ui.screen='pick';
    render();
  }
  else if(action==='proceed'){
    const r = raceById(ch.raceId);
    ui.screen = r.subraces ? 'subrace' : 'racial';
    render();
  }
  else if(action==='pick-subrace'){
    const r = raceById(ch.raceId);
    const subId = e.currentTarget.dataset.id;
    const sub = r.subraces.find(s=>s.id===subId);
    ch.subrace = { subraceId:sub.id, label:sub.label };
    render();
  }
  else if(action==='continue-subrace'){
    ui.screen='racial';
    render();
  }
  else if(action==='pick-racial'){
    const r = raceById(ch.raceId);
    const optId = e.currentTarget.dataset.id;
    const opt = r.racialDetail.options.find(o=>o.id===optId);
    ch.racialChoice = { prompt:r.racialDetail.prompt, optionId:opt.id, label:opt.label };
    render();
  }
  else if(action==='continue-racial'){
    ui.screen='align-entry';
    render();
  }
  else if(action==='start-align-quiz'){
    ui.screen='align-quiz'; ui.alignStep=0;
    ch.alignment.tookQuiz=true;
    ch.alignment.answers=[]; ch.alignment.resolved=null;
    render();
  }
  else if(action==='start-align-pick'){
    ch.alignment.tookQuiz=false;
    ch.alignment.answers=[]; ch.alignment.resolved=null;
    ch.alignment.definingExperience=null;
    ui.expandedId=null;
    ui.screen='align-pick';
    render();
  }
  else if(action==='align-answer'){
    const questions = alignmentQuestionsFor(ch.raceId);
    const q = questions[ui.alignStep];
    const opt = q.options.find(o=>o.id===e.currentTarget.dataset.id);
    ch.alignment.answers[ui.alignStep] = { questionId:q.id, optionId:opt.id, label:opt.label };
    if(ui.alignStep < questions.length-1){
      ui.alignStep++;
      render();
    } else {
      ch.alignment.resolved = resolveAlignment();
      ch.alignment.definingExperience = definingExperience();
      ui.expandedId = ch.alignment.resolved.alignmentId;
      ui.screen='align-pick';
      render();
    }
  }
  else if(action==='align-expand'){
    const id = e.currentTarget.dataset.id;
    ui.expandedId = ui.expandedId===id ? null : id;
    render();
  }
  else if(action==='align-confirm'){
    ch.alignment.alignmentId = e.currentTarget.dataset.id;
    ui.screen='align-confirm';
    render();
  }
  else if(action==='align-change'){
    ui.expandedId = ch.alignment.alignmentId;
    ui.screen='align-pick';
    render();
  }
  else if(action==='finish'){
    ui.screen='hub';
    ui.hubTab='sheet';
    ui.worldView='areas';
    ui.worldArea=null;
    ui.worldBuilding=null;
    ui.worldRoom=null;
    render();
  }
  else if(action==='hub-tab'){
    ui.hubTab = e.currentTarget.dataset.tab;
    render();
  }
  else if(action==='world-nav'){
    const view = e.currentTarget.dataset.view;
    ui.worldView = view;
    if(view==='areas'){ ui.worldArea=null; ui.worldBuilding=null; ui.worldRoom=null; }
    if(view==='buildings'){ ui.worldBuilding=null; ui.worldRoom=null; }
    if(view==='rooms'){ ui.worldRoom=null; }
    render();
  }
  else if(action==='world-select-area'){
    const area = e.currentTarget.dataset.area;
    if(ch.unlocked.areas[areaKey(area)]){
      ui.worldArea = area;
      ui.worldView = 'buildings';
      render();
      return;
    }
    startJob({ kind:'area', area });
  }
  else if(action==='world-select-building'){
    const building = e.currentTarget.dataset.building;
    const key = buildingKey(ui.worldArea, building);
    if(ch.unlocked.buildings[key]){
      ui.worldBuilding = building;
      ui.worldView = 'rooms';
      render();
      return;
    }
    startJob({ kind:'building', area:ui.worldArea, building });
  }
  else if(action==='world-select-room'){
    const room = e.currentTarget.dataset.room;
    const key = roomKey(ui.worldArea, ui.worldBuilding, room);
    if(ch.unlocked.rooms[key]){
      ui.worldRoom = room;
      ui.worldView = 'activities';
      render();
      return;
    }
    startJob({ kind:'room', area:ui.worldArea, building:ui.worldBuilding, room });
  }
  else if(action==='world-select-activity'){
    if(ch.featurePoints <= 0){
      showToast('No feature points left.');
      return;
    }
    const activity = e.currentTarget.dataset.activity;
    const feature = e.currentTarget.dataset.feature;
    const archetype = e.currentTarget.dataset.archetype;
    if(ch.features.some(f=>f.feature===feature && f.activity===activity)){
      showToast('Already learned.');
      return;
    }
    startJob({
      kind:'activity',
      area:ui.worldArea,
      building:ui.worldBuilding,
      room:ui.worldRoom,
      activity,
      feature,
      archetype,
    });
  }
}

async function loadJson(path){
  const res = await fetch(path);
  if(!res.ok) throw new Error('Failed to load '+path+' ('+res.status+')');
  return res.json();
}

async function boot(){
  try {
    const [
      skills,
      tracks,
      races,
      raceQuestions,
      alignments,
      alignmentQuestions,
      raceAlignment,
    ] = await Promise.all([
      loadJson('/data/skills.json'),
      loadJson('/data/tracks.json'),
      loadJson('/data/races.json'),
      loadJson('/data/race-questions.json'),
      loadJson('/data/alignments.json'),
      loadJson('/data/alignment-questions.json'),
      loadJson('/data/race-alignment.json'),
    ]);

    FEATURES = skills;
    if(!Array.isArray(FEATURES)) throw new Error('skills.json must be an array');
    TRACKS = tracks;
    RACES = races;
    RACE_QUESTIONS = raceQuestions;
    ALIGNMENTS = alignments;
    ALIGNMENT_QUESTIONS = alignmentQuestions;
    RACE_ALIGNMENT_EXTRAS = raceAlignment.extras || {};
    RACE_QUESTION_OVERRIDES = raceAlignment.overrides || {};
    RACE_QUESTION_SKIPS = raceAlignment.skips || {};
    RACE_AXIS_BIAS = raceAlignment.axisBias || {};

    rebuildWorld();
    render();
  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="screen"><p class="lede">Could not load creation data.</p><pre style="white-space:pre-wrap;font-size:12px;color:var(--ink-soft)">${esc(String(err && err.message || err))}</pre></div>`;
  }
}

boot();
</script>
